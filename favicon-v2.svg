<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Royal Navy to Electric Tech Blue to Bright Cyan -->
    <linearGradient id="vpntopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Left Wing Gradient: Electric Cyan to Blue -->
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Right Wing Gradient: Crisp Diamond White with Soft Ice Sheen -->
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Top Core Speed Beam -->
    <linearGradient id="coreBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Drop Shadow for 3D depth -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0b132b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Container with Premium Curvature -->
  <rect width="100" height="100" rx="26" fill="url(#vpntopBg)" />

  <!-- Inner Subtle Glass Rim Light -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="24.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2" fill="none" />

  <!-- Supersonic Delta "V" & "TOP" Apex Symbol -->
  <g filter="url(#logoShadow)">
    <!-- Left Wing (Cyber Cyan Gradient) -->
    <path d="M50 18 L21 73 C19 77 23 81 27 79 L50 65 Z" fill="url(#leftWing)" />

    <!-- Right Wing (Diamond White) -->
    <path d="M50 18 L79 73 C81 77 77 81 73 79 L50 65 Z" fill="url(#rightWing)" />

    <!-- Center Speed Backbone / Fuselage -->
    <path d="M50 20 L53.5 56 L50 62 L46.5 56 Z" fill="url(#coreBeam)" />

    <!-- Lower Afterburner Speed Chevron (Echoing TOP / Speed) -->
    <path d="M50 70 L34 81 C32 82 35 85 38 83.5 L50 76 L62 83.5 C65 85 68 82 66 81 Z" fill="#38bdf8" opacity="0.95" />
  </g>
</svg>
